version: "3"

dotenv:
  - .env

includes:
  cluster:
    taskfile: ./tasks/cluster.yml
    dir: .
  infra:
    taskfile: ./tasks/infrastructure.yml
    dir: .
  gitops:
    taskfile: ./tasks/gitops.yml
    dir: .
  ops:
    taskfile: ./tasks/ops.yml
    dir: .
  check:
    taskfile: ./tasks/checks.yml
    dir: .

tasks:
  ### INFO ###
  default:
    desc: Show available task commands
    cmds:
      - task --list

  help:
    desc: Show available task commands
    cmds:
      - task --list

  ### 0. Prepare stage ###
  init:
    desc: Initialize cluster and infrastructure entrypoints
    cmds:
      - task cluster:init
      - task infra:init

  fmt:
    desc: Run OpenTofu formatting recursively
    cmds:
      - task check:tofu-fmt

  validate:
    desc: Run the local validation baseline
    cmds:
      - task check:validate

  sync-chart-versions:
    desc: Synchronize generated Argo CD chart pins from versions.yaml
    cmds:
      - task check:chart-versions-sync

  render-env-contract:
    desc: Merge homelab.yaml with the tracked environment override
    cmds:
      - ./scripts/render-environment-contract.sh

  sync-env-contract:
    desc: Synchronize tracked Argo CD consumers from the effective environment contract
    cmds:
      - task check:env-contract-sync

  day0-guide:
    desc: Alias for ops:day0-guide
    cmds:
      - task ops:day0-guide

  day1-guide:
    desc: Alias for ops:day1-guide
    cmds:
      - task ops:day1-guide

  garage-velero-guide:
    desc: Alias for ops:garage-velero-guide
    cmds:
      - task ops:garage-velero-guide

  garage-status:
    desc: Alias for ops:garage-status
    cmds:
      - task ops:garage-status

  garage-node-id:
    desc: Alias for ops:garage-node-id
    cmds:
      - task ops:garage-node-id

  garage-velero-bootstrap:
    desc: Alias for ops:garage-velero-bootstrap
    cmds:
      - task ops:garage-velero-bootstrap

  hosts-entries:
    desc: Alias for ops:hosts-entries
    cmds:
      - task ops:hosts-entries

  openbao-day0:
    desc: Alias for ops:openbao-day0
    cmds:
      - task ops:openbao-day0

  openbao-port-forward-start:
    desc: Alias for ops:openbao-port-forward-start
    cmds:
      - task ops:openbao-port-forward-start

  openbao-port-forward-stop:
    desc: Alias for ops:openbao-port-forward-stop
    cmds:
      - task ops:openbao-port-forward-stop

  openbao-port-forward-status:
    desc: Alias for ops:openbao-port-forward-status
    cmds:
      - task ops:openbao-port-forward-status

  seed-runtime-secrets:
    desc: Alias for ops:seed-runtime-secrets
    cmds:
      - task ops:seed-runtime-secrets

  openbao-runtime-preflight:
    desc: Alias for ops:openbao-runtime-preflight
    cmds:
      - task ops:openbao-runtime-preflight

  openbao-runtime-preflight-final:
    desc: Alias for ops:openbao-runtime-preflight-final
    cmds:
      - task ops:openbao-runtime-preflight-final

  post-argocd-check:
    desc: Alias for ops:post-argocd-check
    cmds:
      - task ops:post-argocd-check

  export-root-ca:
    desc: Alias for ops:export-root-ca
    cmds:
      - task ops:export-root-ca

  gitops-preflight:
    desc: Alias for gitops:preflight
    cmds:
      - task gitops:preflight

  apply-gitops-bootstrap:
    desc: Alias for gitops:apply-bootstrap
    cmds:
      - task gitops:apply-bootstrap

  from-scratch:
    desc: Run greenfield cluster bootstrap, platform bootstrap, then print day-0 guide
    cmds:
      - task cluster:apply
      - task infra:apply
      - task ops:day0-guide

  destroy:
    desc: Destroy infrastructure, then cluster
    cmds:
      - task infra:destroy
      - task cluster:destroy
