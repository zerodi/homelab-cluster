version: "3"

dotenv:
  - .env

vars:
  ENVIRONMENT_CONTRACT_PATH:
    sh: uv run --project homelabctl --locked homelabctl internal task-var environment-contract
  KUBECONFIG_PATH:
    sh: uv run --project homelabctl --locked homelabctl internal task-var kubeconfig
  TALOSCONFIG_PATH:
    sh: uv run --project homelabctl --locked homelabctl internal task-var talosconfig
  CONTROLPLANE_IPS:
    sh: uv run --project homelabctl --locked homelabctl internal task-var cluster-output controlplane_ips_csv
  WORKER_IPS:
    sh: uv run --project homelabctl --locked homelabctl internal task-var cluster-output worker_ips_csv
  PRIMARY_CONTROLPLANE_IP:
    sh: uv run --project homelabctl --locked homelabctl internal task-var cluster-output controlplane_ips_csv | cut -d, -f1

includes:
  cluster:
    taskfile: ./tasks/cluster.yml
    dir: .
  infra:
    taskfile: ./tasks/infrastructure.yml
    dir: .
  gitops:
    taskfile: ./tasks/gitops.yml
    dir: .
  ops:
    taskfile: ./tasks/ops.yml
    dir: .
  check:
    taskfile: ./tasks/checks.yml
    dir: .

tasks:
  ### INFO ###
  default:
    desc: Show available task commands
    cmds:
      - task --list

  help:
    desc: Show available task commands
    cmds:
      - task --list

  ### 0. Prepare stage ###
  init:
    desc: Initialize cluster and infrastructure entrypoints
    cmds:
      - task ops:secure-local-files
      - task cluster:init
      - task infra:init
      - task ops:secure-local-files

  fmt:
    desc: Run OpenTofu formatting recursively
    cmds:
      - task check:tofu-fmt

  validate:
    desc: Run the local validation baseline
    cmds:
      - task check:validate

  sync-versions:
    desc: Synchronize generated consumers from versions.yaml
    cmds:
      - task check:versions-sync

  render-env-contract:
    desc: Merge homelab.yaml with the optional local environment override
    cmds:
      - uv run --project homelabctl --locked homelabctl env render

  sync-env-contract:
    desc: Synchronize tracked Argo CD consumers from the effective environment contract
    cmds:
      - task check:env-contract-sync

  from-scratch:
    desc: Run greenfield cluster bootstrap, platform bootstrap, then print day-0 guide
    cmds:
      - task cluster:apply
      - task cluster:health
      - task infra:apply
      - task ops:day0-guide

  destroy:
    desc: Destroy infrastructure, then cluster
    cmds:
      - task infra:destroy
      - task cluster:destroy
