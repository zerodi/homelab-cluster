version: "3"

vars:
  ROOT_CA_EXPORT_PATH: '{{default "out/homelab-root-ca.crt" .ROOT_CA_EXPORT_PATH}}'
  GARAGE_NAMESPACE: '{{default "garage" .GARAGE_NAMESPACE}}'
  GARAGE_POD: '{{default "garage-0" .GARAGE_POD}}'
  GARAGE_ZONE: '{{default "homelab" .GARAGE_ZONE}}'
  GARAGE_CAPACITY: '{{default "20G" .GARAGE_CAPACITY}}'
  GARAGE_BUCKET: '{{default "homelab-velero" .GARAGE_BUCKET}}'
  GARAGE_KEY_NAME: '{{default "velero" .GARAGE_KEY_NAME}}'
  GARAGE_NODE_ID: '{{default "" .GARAGE_NODE_ID}}'

tasks:
  day0-guide:
    desc: Print the manual OpenBao day-0 bootstrap checklist
    cmds:
      - |
        printf '%s\n' \
          'Day-0 bootstrap OpenBao:' \
          '  1. Откройте port-forward: task ops:openbao-port-forward-start.' \
          '  2. Инициализируйте и разлочьте OpenBao.' \
          '  3. Экспортируйте BAO_TOKEN и запустите task ops:openbao-day0.' \
          '  4. Экспортируйте CLOUDFLARE_API_TOKEN для DNS-01.' \
          '  5. Задайте PLATFORM_ADMIN_PASSWORD в root .env.' \
          '  6. Создайте только отсутствующие paths: task ops:seed-runtime-secrets.' \
          '  7. При необходимости просмотрите команды: task ops:generate-runtime-secret-puts.' \
          '  8. Runtime secrets:' \
          '     - secret/platform/cert-manager/cloudflare' \
          '     - secret/platform/authentik/runtime' \
          '     - secret/platform/authentik/platform-admin' \
          '     - secret/platform/forgejo/admin' \
          '     - secret/platform/forgejo/oidc' \
          '     - secret/platform/garage/runtime' \
          '  9. Проверьте contract: task gitops:preflight.' \
          ' 10. Синхронизируйте env contract: task sync-env-contract.' \
          ' 11. Запустите task gitops:apply-bootstrap.' \
          ' 12. Выполните task ops:forgejo-woodpecker-oauth и замените временные Velero S3 credentials.' \
          ' 13. Закройте port-forward: task ops:openbao-port-forward-stop.' \
          ' 14. Полный runbook: docs/day0-bootstrap.md'

  garage-velero-guide:
    desc: Print the manual Garage bootstrap sequence for Velero cutover
    cmds:
      - |
        printf '%s\n' \
          'Garage -> Velero cutover:' \
          '  1. Запишите secret/platform/garage/runtime в OpenBao.' \
          '  2. Синкните garage-prereqs и garage.' \
          '  3. Проверьте pod garage-0, Gateway и Certificate.' \
          '  4. Узнайте NODE_ID: kubectl -n garage exec garage-0 -- /garage status' \
          '  5. Назначьте layout: kubectl -n garage exec garage-0 -- /garage layout assign -z homelab -c 20G <NODE_ID>' \
          '  6. Примените layout: kubectl -n garage exec garage-0 -- /garage layout apply --version 1' \
          '  7. Создайте bucket: kubectl -n garage exec garage-0 -- /garage bucket create homelab-velero' \
          '  8. Создайте key: kubectl -n garage exec garage-0 -- /garage key create velero' \
          '  9. Выдайте доступ: kubectl -n garage exec garage-0 -- /garage bucket allow --read --write --owner homelab-velero --key velero' \
          ' 10. Получите secret: kubectl -n garage exec garage-0 -- /garage key info velero --show-secret' \
          ' 11. Обновите secret/platform/velero/s3 в OpenBao.' \
          ' 12. После этого переключайте Velero на garage-s3.garage.svc.cluster.local:3900.' \
          ' 13. Runbook: docs/garage-velero.md'

  garage-status:
    desc: Show raw Garage status from the running pod
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - |
        GARAGE_NAMESPACE="{{.GARAGE_NAMESPACE}}" \
        GARAGE_POD="{{.GARAGE_POD}}" \
        uv run --project homelabctl --locked homelabctl ops garage --kubeconfig "{{.KUBECONFIG_PATH}}" status

  garage-node-id:
    desc: Detect the current Garage node id from garage status
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - |
        GARAGE_NAMESPACE="{{.GARAGE_NAMESPACE}}" \
        GARAGE_POD="{{.GARAGE_POD}}" \
        GARAGE_NODE_ID="{{.GARAGE_NODE_ID}}" \
        uv run --project homelabctl --locked homelabctl ops garage --kubeconfig "{{.KUBECONFIG_PATH}}" detect-node-id

  garage-velero-bootstrap:
    desc: Print Garage bootstrap commands for the Velero bucket and key
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - |
        GARAGE_NAMESPACE="{{.GARAGE_NAMESPACE}}" \
        GARAGE_POD="{{.GARAGE_POD}}" \
        GARAGE_ZONE="{{.GARAGE_ZONE}}" \
        GARAGE_CAPACITY="{{.GARAGE_CAPACITY}}" \
        GARAGE_BUCKET="{{.GARAGE_BUCKET}}" \
        GARAGE_KEY_NAME="{{.GARAGE_KEY_NAME}}" \
        GARAGE_NODE_ID="{{.GARAGE_NODE_ID}}" \
        uv run --project homelabctl --locked homelabctl ops garage --kubeconfig "{{.KUBECONFIG_PATH}}" print-bootstrap

  garage-velero-apply:
    desc: Idempotently create the Garage bucket/key and store credentials in OpenBao
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "${BAO_TOKEN:-}"
      - |
        GARAGE_NAMESPACE="{{.GARAGE_NAMESPACE}}" \
        GARAGE_POD="{{.GARAGE_POD}}" \
        GARAGE_BUCKET="{{.GARAGE_BUCKET}}" \
        GARAGE_KEY_NAME="{{.GARAGE_KEY_NAME}}" \
        uv run --project homelabctl --locked homelabctl ops garage --kubeconfig "{{.KUBECONFIG_PATH}}" bootstrap-velero

  hosts-entries:
    desc: Print all actual LoadBalancer IP/domain pairs for the client hosts file
    silent: true
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - >-
        uv run --project homelabctl --locked homelabctl ops hosts
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"

  day1-guide:
    desc: Print the day-1 operations runbook location
    cmds:
      - "printf '%s\\n' 'Day-1 operations runbook: docs/day1-operations.md'"

  generate-runtime-secret-puts:
    desc: Print complete bao kv put commands for runtime secrets
    cmds:
      - uv run --project homelabctl --locked homelabctl secrets print

  authentik-admin-password:
    desc: Print the Authentik akadmin bootstrap password from OpenBao
    silent: true
    cmds:
      - test -n "${BAO_TOKEN:-}"
      - bao kv get -field=bootstrap_password "${BAO_KV_MOUNT:-secret}/platform/authentik/runtime"

  stalwart-admin-password:
    desc: Print the Stalwart recovery admin password from OpenBao
    silent: true
    cmds:
      - test -n "${BAO_TOKEN:-}"
      - bao kv get -field=recovery_admin_password "${BAO_KV_MOUNT:-secret}/platform/stalwart/runtime"

  initial-app-credentials:
    desc: Print initial interactive administrator logins and passwords
    silent: true
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.ENVIRONMENT_CONTRACT_PATH}}"
      - >-
        uv run --project homelabctl --locked homelabctl ops credentials
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"

  seed-runtime-secrets:
    desc: Create missing OpenBao runtime secret paths without overwriting existing paths
    cmds:
      - uv run --project homelabctl --locked homelabctl secrets seed

  forgejo-woodpecker-oauth:
    desc: Create or rotate the system-wide Forgejo OAuth2 application for Woodpecker
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.ENVIRONMENT_CONTRACT_PATH}}"
      - test -n "${BAO_TOKEN:-}"
      - >-
        uv run --project homelabctl --locked homelabctl forgejo woodpecker-oauth
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"
        {{.CLI_ARGS}}

  openbao-day0:
    desc: Run the OpenBao post-init day-0 helper for External Secrets
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - uv run --project homelabctl --locked homelabctl bao configure-day0 --kubeconfig "{{.KUBECONFIG_PATH}}"

  openbao-port-forward-start:
    desc: Start a managed local OpenBao port-forward on 127.0.0.1:8200
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - uv run --project homelabctl --locked homelabctl bao port-forward start --kubeconfig "{{.KUBECONFIG_PATH}}"

  openbao-port-forward-stop:
    desc: Stop the managed local OpenBao port-forward
    cmds:
      - uv run --project homelabctl --locked homelabctl bao port-forward stop

  openbao-port-forward-status:
    desc: Show managed local OpenBao port-forward status
    cmds:
      - uv run --project homelabctl --locked homelabctl bao port-forward status

  openbao-runtime-preflight:
    desc: Validate required OpenBao runtime secret paths and keys without printing secret values
    cmds:
      - uv run --project homelabctl --locked homelabctl check runtime-secrets

  openbao-runtime-preflight-final:
    desc: Require all OpenBao runtime secrets to contain final integration credentials
    cmds:
      - uv run --project homelabctl --locked homelabctl check runtime-secrets --require-final

  post-argocd-check:
    desc: Run post-bootstrap Argo CD and runtime smoke checks
    cmds:
      - uv run --project homelabctl --locked homelabctl ops post-check --kubeconfig "{{.KUBECONFIG_PATH}}"

  observability-smoke:
    desc: Verify OTLP trace round-trip, Grafana provisioning, and webhook delivery
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - >-
        uv run --project homelabctl --locked homelabctl ops observability-smoke
        --kubeconfig "{{.KUBECONFIG_PATH}}"

  argocd-access-finalize:
    desc: Rotate and verify Argo CD break-glass access, then remove the bootstrap Secret
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.ENVIRONMENT_CONTRACT_PATH}}"
      - test -n "${BAO_TOKEN:-}"
      - >-
        uv run --project homelabctl --locked homelabctl ops argocd-access-finalize
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"
        --root-ca "{{.ROOT_CA_EXPORT_PATH}}"

  identity-smoke:
    desc: Verify Authentik, Argo CD OIDC/RBAC, and OpenBao-backed break-glass access
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.ENVIRONMENT_CONTRACT_PATH}}"
      - test -n "${BAO_TOKEN:-}"
      - >-
        uv run --project homelabctl --locked homelabctl ops identity-smoke
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"
        --root-ca "{{.ROOT_CA_EXPORT_PATH}}"

  export-root-ca:
    desc: Export the homelab root CA certificate from cert-manager to a local file
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - mkdir -p "$(dirname "{{.ROOT_CA_EXPORT_PATH}}")"
      - |
        KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl -n cert-manager get secret homelab-root-ca \
          -o go-template='{{`{{ index .data "tls.crt" }}`}}' | base64 -d > "{{.ROOT_CA_EXPORT_PATH}}"
      - "printf '%s\\n' 'Exported homelab root CA to {{.ROOT_CA_EXPORT_PATH}}'"
