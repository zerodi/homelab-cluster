version: "3"

vars:
  ENVIRONMENT_CONTRACT_PATH:
    sh: >-
      { p="${TF_VAR_environment_contract_path:-}";
      if [ -n "$p" ]; then
      case "$p" in /*) ;; *) p="infrastructure/$p";; esac;
      realpath "$p";
      else
      ./scripts/render-environment-contract.sh;
      fi; }
  KUBECONFIG_PATH:
    sh: >-
      { p="${TF_VAR_kubeconfig_path:-${KUBECONFIG:-}}";
      if [ -z "$p" ]; then
      p="$(tofu -chdir=bootstrap output -raw kubeconfig_path 2>/dev/null || true)";
      fi;
      [ -z "$p" ] || realpath "$p" 2>/dev/null || printf '%s\n' "$p"; }
  PIRAEUS_NAMESPACE:
    sh: >-
      { value="${TF_VAR_piraeus_namespace:-}";
      if [ -z "$value" ]; then
      value="$(yq eval -r '.storage.piraeus.namespace // ""' "{{.ENVIRONMENT_CONTRACT_PATH}}")";
      fi;
      printf '%s\n' "$value"; }
  PIRAEUS_POOL_NAME:
    sh: >-
      { value="${TF_VAR_piraeus_storage_pool_name:-}";
      if [ -z "$value" ]; then
      value="$(yq eval -r '.storage.piraeus.pool_name // ""' "{{.ENVIRONMENT_CONTRACT_PATH}}")";
      fi;
      printf '%s\n' "$value"; }
  PIRAEUS_DEVICE:
    sh: >-
      { value="${TF_VAR_piraeus_storage_device:-}";
      if [ -z "$value" ]; then
      value="$(yq eval -r '.storage.piraeus.device // ""' "{{.ENVIRONMENT_CONTRACT_PATH}}")";
      fi;
      printf '%s\n' "$value"; }
  PIRAEUS_NODES:
    sh: >-
      { value="${TF_VAR_piraeus_storage_nodes:-}";
      if [ -n "$value" ]; then
      printf '%s' "$value" | yq eval -p=json -r 'join(" ")' -;
      else
      json="$(tofu -chdir=bootstrap output -json worker_hostnames 2>/dev/null || true)";
      [ -z "$json" ] || printf '%s' "$json" |
      yq eval -p=json -r 'join(" ")' -;
      fi; }

env:
  TF_VAR_environment_contract_path: "{{.ENVIRONMENT_CONTRACT_PATH}}"

tasks:
  init:
    desc: Initialize the infrastructure OpenTofu entrypoint
    cmds:
      - tofu -chdir=infrastructure init {{.CLI_ARGS}}

  plan:
    desc: Plan the first infrastructure bootstrap stage without CRD-backed manifests
    cmds:
      - |
        tofu -chdir=infrastructure plan \
          -var=crd_backed_resources_enabled=false \
          -target=helm_release.cert_manager \
          -target=helm_release.external_secrets \
          -target=helm_release.trust_manager \
          -target=kubernetes_namespace_v1.piraeus \
          -target=kubernetes_labels.piraeus_namespace_pod_security \
          -target=helm_release.piraeus_operator

  wait-crds:
    desc: Wait for platform CRDs to register in API discovery
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=10m crd/clusterissuers.cert-manager.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=10m crd/certificates.cert-manager.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=10m crd/bundles.trust.cert-manager.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=10m crd/linstorsatelliteconfigurations.piraeus.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=10m crd/linstorclusters.piraeus.io

  bootstrap-piraeus-storage:
    desc: Create LINSTOR device pools outside the Terraform graph
    cmds:
      - |
        test -n "{{.KUBECONFIG_PATH}}" || {
          echo "Missing kubeconfig. Complete bootstrap or set KUBECONFIG/TF_VAR_kubeconfig_path." >&2
          exit 1
        }
      - |
        test -n "{{.PIRAEUS_NAMESPACE}}" || {
          echo "Missing storage.piraeus.namespace in the effective environment contract." >&2
          exit 1
        }
      - |
        test -n "{{.PIRAEUS_POOL_NAME}}" || {
          echo "Missing storage.piraeus.pool_name in the effective environment contract." >&2
          exit 1
        }
      - |
        test -n "{{.PIRAEUS_DEVICE}}" || {
          echo "Missing storage.piraeus.device in the effective environment contract." >&2
          exit 1
        }
      - |
        test -n "{{.PIRAEUS_NODES}}" || {
          echo "Missing bootstrap worker_hostnames output." >&2
          exit 1
        }
      - |
        ./scripts/bootstrap-linstor-storage.sh \
          --kubeconfig "{{.KUBECONFIG_PATH}}" \
          --namespace "{{.PIRAEUS_NAMESPACE}}" \
          --pool-name "{{.PIRAEUS_POOL_NAME}}" \
          --device "{{.PIRAEUS_DEVICE}}" \
          --nodes "{{.PIRAEUS_NODES}}"

  apply:
    desc: Apply infrastructure in stages, including CRD readiness and LINSTOR storage bootstrap
    cmds:
      - |
        tofu -chdir=infrastructure apply \
          -var=crd_backed_resources_enabled=false \
          -target=helm_release.cert_manager \
          -target=helm_release.external_secrets \
          -target=helm_release.trust_manager \
          -target=kubernetes_namespace_v1.piraeus \
          -target=kubernetes_labels.piraeus_namespace_pod_security \
          -target=helm_release.piraeus_operator
      - task infra:wait-crds
      - |
        tofu -chdir=infrastructure apply \
          -target=kubernetes_manifest.selfsigned_clusterissuer \
          -target=kubernetes_manifest.homelab_root_ca \
          -target=kubernetes_manifest.homelab_ca_clusterissuer \
          -target=kubernetes_cluster_role_binding_v1.external_secrets_openbao_auth_delegator
      - |
        tofu -chdir=infrastructure apply \
          -target=helm_release.piraeus_operator \
          -target=terraform_data.piraeus_operator_ready \
          -target=kubernetes_manifest.linstor_satellite_configuration_talos \
          -target=kubernetes_manifest.linstor_cluster \
          -target=terraform_data.linstor_cluster_ready
      - task infra:bootstrap-piraeus-storage
      - tofu -chdir=infrastructure apply

  destroy:
    desc: Run staged infrastructure destroy with CRD-backed cleanup
    cmds:
      - ./scripts/destroy-platform-bootstrap.sh

  health:
    desc: Run local platform bootstrap checks after infrastructure apply
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.PIRAEUS_NAMESPACE}}"
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=5m crd/clusterissuers.cert-manager.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=5m crd/certificates.cert-manager.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=5m crd/externalsecrets.external-secrets.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=5m crd/secretstores.external-secrets.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=5m crd/bundles.trust.cert-manager.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Established --timeout=5m crd/linstorclusters.piraeus.io
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Ready pod --all -n cert-manager --timeout=10m
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Ready pod --all -n external-secrets --timeout=10m
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Ready pod --all -n "{{.PIRAEUS_NAMESPACE}}" --timeout=10m
      - |
        if KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl get namespace trust-manager >/dev/null 2>&1; then
          KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Ready pod --all -n trust-manager --timeout=10m
        fi
      - |
        if KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl get namespace argocd >/dev/null 2>&1; then
          KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl wait --for=condition=Ready pod --all -n argocd --timeout=10m
        fi
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl get namespace cert-manager openbao external-secrets "{{.PIRAEUS_NAMESPACE}}"
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl get clusterissuer
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl get linstorcluster -A
      - KUBECONFIG="{{.KUBECONFIG_PATH}}" kubectl -n openbao get pods
