version: "3"

tasks:
  versions:
    desc: Verify all release pins and generated mirrors against versions.yaml
    cmds:
      - uv run --project homelabctl --locked homelabctl check release-versions
      - uv run --project homelabctl --locked homelabctl check chart-versions
      - uv run --project homelabctl --locked homelabctl check image-versions

  versions-sync:
    desc: Synchronize generated release-version mirrors from versions.yaml
    cmds:
      - uv run --project homelabctl --locked homelabctl check release-versions --write
      - uv run --project homelabctl --locked homelabctl check chart-versions --write
      - uv run --project homelabctl --locked homelabctl check image-versions --write
      - task check:versions

  cluster-isolation:
    desc: Verify that cluster does not own platform or runtime resources
    cmds:
      - uv run --project homelabctl --locked homelabctl check cluster-isolation

  tfvars-example:
    desc: Verify terraform.tfvars.example documents every OpenTofu input
    cmds:
      - uv run --project homelabctl --locked homelabctl check tfvars-example

  infrastructure-isolation:
    desc: Verify infrastructure ownership and its required cluster state contract
    cmds:
      - uv run --project homelabctl --locked homelabctl check infrastructure-isolation

  platform-layout:
    desc: Verify the Argo CD platform orchestration and payload boundary
    cmds:
      - uv run --project homelabctl --locked homelabctl check platform-layout

  chart-versions:
    desc: Backward-compatible alias for the unified version check
    cmds:
      - task check:versions

  chart-versions-sync:
    desc: Backward-compatible alias for unified version synchronization
    cmds:
      - task check:versions-sync

  documentation:
    desc: Verify documentation layout and local Markdown links
    cmds:
      - uv run --project homelabctl --locked homelabctl check documentation

  env-contract:
    desc: Validate that the effective environment contract stays in sync with argocd/ consumers
    cmds:
      - uv run --project homelabctl --locked homelabctl env validate --mode scaffold

  env-contract-sync:
    desc: Synchronize argocd/ consumers from the effective environment contract
    cmds:
      - uv run --project homelabctl --locked homelabctl env validate --mode scaffold --write
      - uv run --project homelabctl --locked homelabctl env validate --mode scaffold

  runtime-secret-contract:
    desc: Verify OpenBao seed paths and keys against ExternalSecret manifests
    cmds:
      - uv run --project homelabctl --locked homelabctl check runtime-secrets --contract-only

  tofu-fmt:
    desc: Run tofu fmt -check recursively
    cmds:
      - tofu -chdir=cluster fmt -check
      - tofu -chdir=infrastructure fmt -check

  tofu-validate-cluster:
    desc: Run tofu validate for cluster/
    cmds:
      - tofu -chdir=cluster validate

  tofu-validate-infrastructure:
    desc: Run tofu validate for infrastructure/
    cmds:
      - tofu -chdir=infrastructure validate

  yamllint:
    desc: Run yamllint across the repository
    cmds:
      - uv run --project homelabctl --locked homelabctl check yaml .

  operator-helpers:
    desc: Run side-effect-free parser tests for operator helpers
    cmds:
      - uv run --project homelabctl --locked homelabctl check operator-helpers

  python:
    desc: Run homelabctl unit tests, formatting check, and lint
    cmds:
      - uv run --project homelabctl --locked pytest -q
      - uv run --project homelabctl --locked ruff format --check homelabctl/src homelabctl/tests
      - uv run --project homelabctl --locked ruff check homelabctl/src homelabctl/tests

  kustomize-bootstrap:
    desc: Build argocd/bootstrap with kustomize or kubectl fallback
    cmds:
      - |
        if command -v kustomize >/dev/null 2>&1; then
          kustomize build argocd/bootstrap
        else
          kubectl kustomize argocd/bootstrap
        fi

  kustomize-platform:
    desc: Build argocd/platform with kustomize or kubectl fallback
    cmds:
      - |
        if command -v kustomize >/dev/null 2>&1; then
          kustomize build argocd/platform
        else
          kubectl kustomize argocd/platform
        fi

  validate:
    desc: Run the local validation baseline used by CI and pre-commit
    cmds:
      - task check:cluster-isolation
      - task check:tfvars-example
      - task check:infrastructure-isolation
      - task check:platform-layout
      - task check:versions
      - task check:documentation
      - task check:env-contract
      - task check:runtime-secret-contract
      - task check:tofu-fmt
      - task check:tofu-validate-cluster
      - task check:tofu-validate-infrastructure
      - task check:yamllint
      - task check:operator-helpers
      - task check:python
      - task check:kustomize-bootstrap
      - task check:kustomize-platform
