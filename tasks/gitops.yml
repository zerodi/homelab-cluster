version: "3"

tasks:
  preflight:
    desc: Validate env contract and OpenBao runtime secrets before GitOps bootstrap
    cmds:
      - ./scripts/validate-env-contract.py --mode strict
      - ./scripts/openbao-runtime-preflight.py

  apply-bootstrap:
    desc: Apply the Argo CD root Application after bootstrap preflight checks
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - task gitops:preflight
      - ./scripts/argocd-apply-bootstrap.sh --kubeconfig "{{.KUBECONFIG_PATH}}"

  push:
    desc: Push the committed argocd subtree to the configured Forgejo GitOps repository
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.ENVIRONMENT_CONTRACT_PATH}}"
      - ./scripts/validate-env-contract.py --mode strict
      - task check:kustomize-bootstrap
      - task check:kustomize-platform
      - >-
        ./scripts/argocd-push.sh
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"

  test-ssh-bootstrap:
    desc: Build test-ssh-git and deploy the initial Argo CD tree from it
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - |
        test -n "${TEST_SSH_GIT_HOSTNAME:-}" || {
          echo "Set TEST_SSH_GIT_HOSTNAME to an address reachable from Argo CD pods." >&2
          exit 1
        }
      - ./scripts/validate-env-contract.py --mode scaffold
      - ./scripts/openbao-runtime-preflight.py
      - |
        ./scripts/test-ssh-git-bootstrap.sh \
          --kubeconfig "{{.KUBECONFIG_PATH}}" \
          --hostname "${TEST_SSH_GIT_HOSTNAME}" \
          --port "${TEST_SSH_GIT_PORT:-2222}"
      - ./scripts/openbao-runtime-preflight.py

  test-ssh-stop:
    desc: Stop the local test SSH Git server
    cmds:
      - docker compose --project-directory test-ssh-git -f test-ssh-git/docker-compose.yaml down

  forgejo-cutover:
    desc: Publish argocd/ to Forgejo and switch Argo CD from test-ssh-git
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - test -n "{{.ENVIRONMENT_CONTRACT_PATH}}"
      - |
        test -n "${BAO_ADDR:-}" || {
          echo "Set BAO_ADDR to the unsealed OpenBao endpoint." >&2
          exit 1
        }
      - |
        test -n "${BAO_TOKEN:-}" || {
          echo "Set BAO_TOKEN with access to secret/platform/argocd/repository." >&2
          exit 1
        }
      - >-
        ./scripts/forgejo-argocd-cutover.sh
        --kubeconfig "{{.KUBECONFIG_PATH}}"
        --contract "{{.ENVIRONMENT_CONTRACT_PATH}}"
