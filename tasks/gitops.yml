version: "3"

vars:
  KUBECONFIG_PATH:
    sh: cd bootstrap && { json="$(tofu output -json 2>/dev/null || true)"; printf '%s' "$json" | grep -q '"kubeconfig_path"' || exit 0; p="$(tofu output -raw kubeconfig_path 2>/dev/null || true)"; [ -z "$p" ] || realpath "$p" 2>/dev/null || printf '%s\n' "$p"; }

tasks:
  preflight:
    desc: Validate env contract and OpenBao runtime secrets before GitOps bootstrap
    cmds:
      - ./argocd/scripts/validate-env-contract.py --mode strict
      - ./infrastructure/scripts/openbao-runtime-preflight.py

  apply-bootstrap:
    desc: Apply the Argo CD root Application after bootstrap preflight checks
    cmds:
      - test -n "{{.KUBECONFIG_PATH}}"
      - task gitops:preflight
      - ./argocd/scripts/apply-bootstrap.sh --kubeconfig "{{.KUBECONFIG_PATH}}"
