name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.4.3

      - name: Install yamllint and shellcheck
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Task init cluster
        run: task cluster:init -- -backend=false

      - name: Task init infrastructure
        run: task infra:init -- -backend=false

      - name: Task check baseline
        run: task check:validate
