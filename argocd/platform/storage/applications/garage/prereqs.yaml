apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform-storage-garage
  source:
    repoURL: https://git.lab.zerodi.ru/platform/gitops.git
    targetRevision: 91cd52870c84700b405303ddb80084d7a5b4165f
    path: platform/storage/garage/prereqs
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
