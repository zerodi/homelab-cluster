fullnameOverride: velero
image:
  repository: docker.io/velero/velero
  tag: v1.18.0
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.13.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
    volumeMounts:
      - name: plugins
        mountPath: /target
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault
metrics:
  enabled: true
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: homelab-velero
      default: true
      prefix: clusters/homelab-talos
      credential:
        name: velero-credentials
        key: cloud
      config:
        region: garage
        s3ForcePathStyle: "true"
        s3Url: "http://garage-s3.garage.svc.cluster.local:3900"
  volumeSnapshotLocation: []
  uploaderType: kopia
  backupSyncPeriod: 1m
  defaultBackupStorageLocation: default
  defaultBackupTTL: 168h
  defaultItemOperationTimeout: 4h
  storeValidationFrequency: 1m
  garbageCollectionFrequency: 1h
backupsEnabled: true
snapshotsEnabled: false
deployNodeAgent: true
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # File-system backup requires root access to kubelet pod data. Keep this
  # workload as the single documented restricted-baseline exception.
  podSecurityContext:
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
upgradeJobResources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
schedules:
  cluster-daily:
    disabled: false
    schedule: "0 3 * * *"
    template:
      ttl: 336h
      storageLocation: default
      snapshotVolumes: false
      includedNamespaces:
        - argocd
        - authentik
        - echo
        - forgejo
        - gateway
        - kyverno
        - observability
  platform-hourly:
    disabled: false
    schedule: "15 * * * *"
    template:
      ttl: 72h
      storageLocation: default
      snapshotVolumes: false
      includedNamespaces:
        - argocd
        - authentik
        - forgejo
        - observability
