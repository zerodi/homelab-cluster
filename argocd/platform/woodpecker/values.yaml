fullnameOverride: woodpecker

server:
  enabled: true
  fullnameOverride: woodpecker-server
  createAgentSecret: false
  extraSecretNamesForEnvFrom:
    - woodpecker-runtime
  env:
    WOODPECKER_HOST: https://ci.home.arpa
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://git.home.arpa
    WOODPECKER_FORGEJO_SKIP_VERIFY: "false"
    WOODPECKER_OPEN: "true"
  persistentVolume:
    enabled: true
    storageClass: linstor-pool1-r1
    size: 10Gi
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraVolumes:
    - name: homelab-root-ca
      configMap:
        name: homelab-root-ca
  extraVolumeMounts:
    - name: homelab-root-ca
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: ca-bundle.crt
      readOnly: true

agent:
  enabled: true
  fullnameOverride: woodpecker-agent
  replicaCount: 2
  extraSecretNamesForEnvFrom:
    - woodpecker-runtime
  env:
    WOODPECKER_SERVER: woodpecker-server:9000
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: linstor-pool1-r1
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
  persistence:
    enabled: true
    storageClass: linstor-pool1-r1
    size: 1Gi
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraVolumes:
    - name: homelab-root-ca
      configMap:
        name: homelab-root-ca
  extraVolumeMounts:
    - name: homelab-root-ca
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: ca-bundle.crt
      readOnly: true
