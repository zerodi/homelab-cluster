apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    secret.reloader.stakater.com/reload: stalwart-runtime,stalwart-mail-tls
spec:
  serviceName: stalwart-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_HOSTNAME
              value: mail.lab.zerodi.ru
            - name: STALWART_PUBLIC_URL
              value: https://stalwart.lab.zerodi.ru
          envFrom:
            - secretRef:
                name: stalwart-runtime
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: management
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: mail-tls
              mountPath: /etc/stalwart/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: stalwart-config
        - name: mail-tls
          secret:
            secretName: stalwart-mail-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: linstor-pool1-r1
        resources:
          requests:
            storage: 20Gi
