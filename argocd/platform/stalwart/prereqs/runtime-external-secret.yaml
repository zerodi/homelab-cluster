apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-runtime
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: stalwart-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STALWART_RECOVERY_ADMIN: "admin:{{ .recovery_admin_password }}"
        STALWART_RECOVERY_PASSWORD: "{{ .recovery_admin_password }}"
  data:
    - secretKey: recovery_admin_password
      remoteRef:
        key: platform/stalwart/runtime
        property: recovery_admin_password
