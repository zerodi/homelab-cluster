apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        hosts {
            192.168.100.231 auth.lab.zerodi.ru
            192.168.100.232 echo.lab.zerodi.ru
            192.168.100.233 grafana.lab.zerodi.ru
            192.168.100.234 git.lab.zerodi.ru
            192.168.100.236 hubble.lab.zerodi.ru
            192.168.100.237 garage.lab.zerodi.ru
            192.168.100.235 stalwart.lab.zerodi.ru
            192.168.100.240 mail.lab.zerodi.ru
            fallthrough
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
