apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker-http-redirect
  namespace: woodpecker
spec:
  parentRefs:
    - name: woodpecker
      sectionName: http
  hostnames:
    - ci.home.arpa
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
