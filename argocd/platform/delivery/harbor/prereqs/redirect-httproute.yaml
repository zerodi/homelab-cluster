apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-http-redirect
  namespace: harbor
spec:
  parentRefs:
    - name: harbor
      sectionName: http
  hostnames:
    - harbor.lab.zerodi.ru
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
