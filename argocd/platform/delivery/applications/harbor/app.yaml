apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform-delivery
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: "1.19.2"
      helm:
        releaseName: harbor
        valueFiles:
          - $values/platform/delivery/harbor/values.yaml
    - repoURL: https://git.lab.zerodi.ru/platform/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: harbor-trivy
      namespace: harbor
      jsonPointers:
        # Harbor 1.19.2 always renders this Secret and has no Trivy
        # existingSecret switch. ESO replaces only the credentialed Redis URL;
        # keep chart-owned gitHubToken drift visible to Argo CD.
        - /data/redisURL
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
