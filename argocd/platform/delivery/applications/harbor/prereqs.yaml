apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform-delivery
  source:
    repoURL: https://git.lab.zerodi.ru/platform/gitops.git
    targetRevision: main
    path: platform/delivery/harbor/prereqs
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
