apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://git.example.invalid/replace-me/gitops.git
    targetRevision: main
    path: platform/velero/prereqs
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
