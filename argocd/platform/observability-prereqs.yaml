apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://git.example.net/platform/gitops.git
    targetRevision: main
    path: platform/observability/prereqs
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
