apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-basic-security-context
  annotations:
    policies.kyverno.io/title: Require basic security context
    policies.kyverno.io/category: Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Требует базовый pod/container securityContext для прикладных workload'ов.
spec:
  background: true
  validationFailureAction: Audit
  rules:
    - name: check-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - argocd
                - authentik
                - cert-manager
                - external-secrets
                - forgejo
                - gateway
                - kube-system
                - kyverno
                - observability
                - openbao
                - piraeus-datastore
                - trust-manager
                - velero
      validate:
        message: "Pods must define seccompProfile and containers must use a basic restricted securityContext."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: "*"
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
              =(initContainers):
                - name: "*"
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
          - spec:
              securityContext:
                seccompProfile:
                  type: Localhost
              containers:
                - name: "*"
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
              =(initContainers):
                - name: "*"
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
