apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Запрещает использовать image tag latest для прикладных workload'ов.
spec:
  background: true
  validationFailureAction: Enforce
  rules:
    - name: check-container-tags
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - argocd
                - authentik
                - cert-manager
                - external-secrets
                - forgejo
                - gateway
                - kube-system
                - kyverno
                - observability
                - openbao
                - piraeus-datastore
                - trust-manager
                - velero
      validate:
        message: "Container images must not use the latest tag."
        pattern:
          spec:
            containers:
              - name: "*"
                image: "!*:latest"
            =(initContainers):
              - name: "*"
                image: "!*:latest"
