apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Запрещает использовать image tag latest для прикладных workload'ов.
spec:
  evaluation:
    background:
      enabled: true
  validationActions:
    - Deny
    - Audit
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - argocd
            - authentik
            - cert-manager
            - external-secrets
            - forgejo
            - gateway
            - kube-system
            - kyverno
            - observability
            - openbao
            - piraeus-datastore
            - trust-manager
            - velero
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - message: Container images must not use the latest tag.
      expression: >-
        (!has(object.spec.containers) ||
        object.spec.containers.all(c, !c.image.endsWith(':latest'))) &&
        (!has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, !c.image.endsWith(':latest')))
