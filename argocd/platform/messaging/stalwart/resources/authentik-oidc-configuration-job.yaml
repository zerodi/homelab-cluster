apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-authentik-oidc-configuration
  namespace: stalwart
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-authentik-oidc-configuration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          # renovate: datasource=docker depName=ghcr.io/stalwartlabs/cli versioning=semver-coerced
          image: ghcr.io/stalwartlabs/cli:1.0.12
          imagePullPolicy: IfNotPresent
          args:
            - apply
            - --file
            - /config/plan.ndjson
            - --json
          env:
            - name: STALWART_URL
              value: http://stalwart.stalwart.svc.cluster.local:8080
            - name: STALWART_USER
              value: admin
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-runtime
                  key: STALWART_RECOVERY_PASSWORD
            - name: NO_COLOR
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: plan
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /home/nonroot/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: plan
          configMap:
            name: stalwart-authentik-oidc-plan
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
