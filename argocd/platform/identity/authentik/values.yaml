authentik:
  existingSecret:
    secretName: authentik-runtime
  host: https://auth.lab.zerodi.ru
  error_reporting:
    enabled: false
  outposts:
    authentik_host: https://auth.lab.zerodi.ru
    authentik_host_browser: https://auth.lab.zerodi.ru
  postgresql:
    host: authentik-postgresql.authentik.svc.cluster.local
    name: authentik
    user: authentik
  redis:
    host: authentik-redis-master.authentik.svc.cluster.local
global:
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
server:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    httpGet:
      path: /-/health/live/
      port: http
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    httpGet:
      path: /-/health/ready/
      port: http
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 60
    httpGet:
      path: /-/health/live/
      port: http
  ingress:
    enabled: false
blueprints:
  configMaps:
    - authentik-blueprints
    - stalwart-sso-blueprint
  secrets:
    - platform-identity-blueprint
    - forgejo-sso-blueprint
    - grafana-sso-blueprint
    - argocd-sso-blueprint
    - harbor-sso-blueprint
worker:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsUser: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    exec:
      command:
        - ak
        - healthcheck
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    exec:
      command:
        - ak
        - healthcheck
  startupProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 60
    exec:
      command:
        - ak
        - healthcheck
postgresql:
  enabled: false
redis:
  enabled: false
