apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-sso-bootstrap
  namespace: forgejo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["forgejo-oidc"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["forgejo-sso-config", "homelab-root-ca"]
    verbs: ["get"]
