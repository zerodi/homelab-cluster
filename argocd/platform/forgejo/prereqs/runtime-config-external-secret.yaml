apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runtime-config
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-runtime-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database: |
          DB_TYPE=postgres
          HOST=forgejo-postgresql.forgejo.svc.cluster.local:5432
          NAME=forgejo
          USER=forgejo
          PASSWD={{ .postgres_password }}
          SSL_MODE=disable
        cache: |
          ADAPTER=redis
          HOST=redis://:{{ .valkey_password }}@forgejo-valkey-primary.forgejo.svc.cluster.local:6379/1
        session: |
          PROVIDER=redis
          PROVIDER_CONFIG=redis://:{{ .valkey_password }}@forgejo-valkey-primary.forgejo.svc.cluster.local:6379/2
        queue: |
          TYPE=redis
          CONN_STR=redis://:{{ .valkey_password }}@forgejo-valkey-primary.forgejo.svc.cluster.local:6379/0
  data:
    - secretKey: postgres_password
      remoteRef:
        key: platform/forgejo/postgresql
        property: password
    - secretKey: valkey_password
      remoteRef:
        key: platform/forgejo/valkey
        property: password
