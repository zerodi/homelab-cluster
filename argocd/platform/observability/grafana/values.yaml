fullnameOverride: grafana

annotations:
  secret.reloader.stakater.com/reload: grafana-admin-secret,grafana-oidc

testFramework:
  enabled: false

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

envFromSecret: grafana-oidc

env:
  SSL_CERT_FILE: /etc/ssl/certs/homelab-root-ca.crt

extraConfigmapMounts:
  - name: homelab-root-ca
    mountPath: /etc/ssl/certs/homelab-root-ca.crt
    configMap: homelab-root-ca
    subPath: ca-bundle.crt
    readOnly: true

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClassName: linstor-pool1-r1
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  automountServiceAccountToken: false

automountServiceAccountToken: false

securityContext:
  fsGroup: 472
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  seccompProfile:
    type: RuntimeDefault

grafana.ini:
  server:
    root_url: https://grafana.lab.zerodi.ru/
    domain: grafana.lab.zerodi.ru
  auth:
    oauth_auto_login: true
    signout_redirect_url: https://auth.lab.zerodi.ru/application/o/grafana/end-session/
  auth.generic_oauth:
    enabled: true
    name: Authentik
    scopes: openid profile email
    auth_url: https://auth.lab.zerodi.ru/application/o/authorize/
    token_url: https://auth.lab.zerodi.ru/application/o/token/
    api_url: https://auth.lab.zerodi.ru/application/o/userinfo/
    login_attribute_path: preferred_username
    groups_attribute_path: groups
    role_attribute_path: contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || 'Viewer'
    allow_assign_grafana_admin: true
    allow_sign_up: true
  metrics:
    enabled: true
  unified_alerting:
    enabled: true
  alerting:
    enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.observability.svc.cluster.local:8428
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          serviceMap:
            datasourceUid: victoriametrics
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - service.name
              - service.namespace
              - k8s.namespace.name
              - k8s.pod.name

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: observability
        orgId: 1
        folder: Observability
        type: file
        disableDeletion: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/observability

dashboards:
  observability:
    observability-overview:
      json: |
        {
          "annotations": {"list": []},
          "editable": false,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "id": null,
          "links": [],
          "panels": [
            {
              "datasource": {"type": "prometheus", "uid": "victoriametrics"},
              "fieldConfig": {
                "defaults": {
                  "color": {"mode": "palette-classic"},
                  "custom": {
                    "axisCenteredZero": false,
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  }
                },
                "overrides": []
              },
              "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
              "id": 1,
              "options": {
                "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
                "tooltip": {"mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "max by (job) (up{job=~\"otel-collector-self|victoria-metrics|loki|tempo|grafana|velero|kyverno-admission-controller|kyverno-background-controller|kyverno-cleanup-controller|kyverno-reports-controller\"})",
                  "range": true,
