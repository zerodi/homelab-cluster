                  "editorMode": "code",
                  "expr": "sum by (policy_name, rule_name, result) (increase(kyverno_policy_results_total[15m]))",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Kyverno Policy Results",
              "type": "timeseries"
            },
            {
              "datasource": {"type": "prometheus", "uid": "victoriametrics"},
              "fieldConfig": {
                "defaults": {
                  "color": {"mode": "palette-classic"},
                  "custom": {
                    "axisCenteredZero": false,
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "showPoints": "never",
                    "spanNulls": false
                  }
                },
                "overrides": []
              },
              "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
              "id": 4,
              "options": {
                "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
                "tooltip": {"mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(rate(kyverno_admission_requests_total[5m]))",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Kyverno Admission Requests",
              "type": "timeseries"
            }
          ],
          "refresh": "30s",
          "schemaVersion": 39,
          "style": "dark",
          "tags": ["observability", "velero", "kyverno"],
          "templating": {"list": []},
          "time": {"from": "now-6h", "to": "now"},
          "timepicker": {},
          "timezone": "browser",
          "title": "Velero Kyverno",
          "uid": "velero-kyverno",
          "version": 1,
          "weekStart": ""
        }

alerting:
  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: observability-baseline
        folder: Observability
        interval: 1m
        rules:
          - uid: observability-target-down
            title: Observability Target Down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: min by (job) (max_over_time(up{job=~"otel-collector-self|victoria-metrics|loki|tempo|grafana|hubble-metrics|velero|kyverno-admission-controller|kyverno-background-controller|kyverno-cleanup-controller|kyverno-reports-controller"}[5m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: One or more observability scrape targets are down.
            labels:
              severity: warning
          - uid: otel-exporter-failures
            title: OTel Exporter Failures
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) + sum(rate(otelcol_exporter_send_failed_log_records[5m])) + sum(rate(otelcol_exporter_send_failed_metric_points[5m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: NoData
            execErrState: Alerting
            for: 10m
            annotations:
              summary: OpenTelemetry Collector is failing to export telemetry.
            labels:
              severity: warning
          - uid: hubble-drops-high
            title: Hubble Drops High
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: sum(rate(hubble_drop_total[5m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: NoData
            execErrState: Alerting
            for: 10m
            annotations:
              summary: Hubble observes sustained dropped traffic.
            labels:
              severity: warning
          - uid: cilium-metrics-missing
            title: Cilium Metrics Missing
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: (sum(up{job="cilium-pods", k8s_app="cilium"}) < bool 1) + (sum(up{job="cilium-pods", workload="cilium-operator"}) < bool 1)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            annotations:
              summary: Cilium agent or operator metrics are missing from scrape targets.
            labels:
              severity: warning
          - uid: velero-backup-failures
            title: Velero Backup Failures
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: sum(rate(velero_backup_failure_total[15m])) + sum(rate(velero_backup_partial_failure_total[15m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: NoData
            execErrState: Alerting
            for: 15m
            annotations:
              summary: Velero reports failed or partially failed backups.
            labels:
              severity: warning
          - uid: kyverno-policy-violations
            title: Kyverno Policy Violations
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: sum(increase(kyverno_policy_results_total{result=~"fail|warn|error"}[15m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: NoData
            execErrState: Alerting
            for: 15m
            annotations:
              summary: Kyverno observed new policy violations in the last 15 minutes.
            labels:
              severity: info
          - uid: synthetic-endpoint-down
            title: Synthetic Endpoint Down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: min by (http_url) (max_over_time(httpcheck_status[5m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: An internal platform health endpoint is unavailable.
            labels:
              severity: critical
          - uid: otel-exporter-queue-saturation
            title: OTel Exporter Queue Saturation
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: max by (exporter) (otelcol_exporter_queue_size / clamp_min(otelcol_exporter_queue_capacity, 1))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.8
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: classic_conditions
            noDataState: NoData
            execErrState: Alerting
            for: 10m
            annotations:
              summary: An OpenTelemetry exporter queue is above 80 percent capacity.
            labels:
              severity: warning
