fullnameOverride: otel-agent
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

presets:
  logsCollection:
    enabled: false
    includeCollectorLogs: false
    storeCheckpoints: true
    maxRecombineLogSize: 102400
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false
  kubeletMetrics:
    enabled: true
  resourceDetection:
    enabled: false

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

service:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

alternateConfig:
  receivers:
    kubeletstats:
      # Talos kubelet serving certificates do not include node IP SANs. The
      # receiver still authenticates with its service-account bearer token.
      insecure_skip_verify: true
  exporters:
    otlp:
      endpoint: otel-collector.observability.svc.cluster.local:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        queue_size: 2000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 10m
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  service:
    extensions:
      - health_check
    pipelines:
      metrics:
        receivers:
          - kubeletstats
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - otlp

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

rollout:
  rollingUpdate:
    maxUnavailable: 1
  strategy: RollingUpdate

networkPolicy:
  enabled: false
