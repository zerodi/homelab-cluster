              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 9121
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: forgejo-valkey
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 9121
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: harbor-valkey
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 9121
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
          podSelector:
            matchLabels:
              app.kubernetes.io/name: velero
      ports:
        - protocol: TCP
          port: 8085
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kyverno
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: cilium
      ports:
        - protocol: TCP
          port: 9962
        - protocol: TCP
          port: 9963
        - protocol: TCP
          port: 9965
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: cilium-envoy
      ports:
        - protocol: TCP
          port: 9964
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
