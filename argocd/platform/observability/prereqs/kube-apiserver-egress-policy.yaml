apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-gateway-and-authentik
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
      app.kubernetes.io/name: grafana
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toCIDR:
        - 192.168.110.231/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
