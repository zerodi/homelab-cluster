fullnameOverride: otel-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - services
        - endpoints
      verbs:
        - get
        - list
        - watch

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-collector-self
            scrape_interval: 30s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
          - job_name: victoria-metrics
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - victoria-metrics.observability.svc.cluster.local:8428
          - job_name: loki
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - loki.observability.svc.cluster.local:3100
          - job_name: tempo-distributor
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - tempo-distributor.observability.svc.cluster.local:3200
          - job_name: tempo-query-frontend
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - tempo-query-frontend.observability.svc.cluster.local:3200
          - job_name: hubble-metrics
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - hubble-metrics.kube-system.svc.cluster.local:9965
          - job_name: cilium-pods
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace]
                action: keep
                regex: kube-system
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                action: keep
                regex: "9962|9963"
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                target_label: k8s_app
              - source_labels: [__meta_kubernetes_pod_label_name]
                target_label: workload
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    prometheusremotewrite:
      endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/api/v1/write
    otlp/tempo:
      endpoint: tempo-gateway.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  service:
    extensions:
      - health_check
    pipelines:
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheusremotewrite
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/loki
