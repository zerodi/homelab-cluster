fullnameOverride: otel-collector
mode: deployment
replicaCount: 1

presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
  resourceDetection:
    enabled: true

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - services
        - endpoints
        - namespaces
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - discovery.k8s.io
      resources:
        - endpointslices
      verbs:
        - get
        - list
        - watch

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-collector-self
            scrape_interval: 30s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
          - job_name: victoria-metrics
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - victoria-metrics.observability.svc.cluster.local:8428
          - job_name: loki
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - loki.observability.svc.cluster.local:3100
          - job_name: tempo
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - tempo.observability.svc.cluster.local:3200
          - job_name: grafana
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - grafana.observability.svc.cluster.local:3000
          - job_name: hubble-metrics
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - hubble-metrics.kube-system.svc.cluster.local:9965
          - job_name: cilium-pods
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace]
                action: keep
                regex: kube-system
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                action: keep
                regex: "9962|9963"
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                target_label: k8s_app
              - source_labels: [__meta_kubernetes_pod_label_name]
                target_label: workload
          - job_name: velero
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - velero.velero.svc.cluster.local:8085
          - job_name: kyverno-admission-controller
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - kyverno-svc-metrics.kyverno.svc.cluster.local:8000
          - job_name: kyverno-background-controller
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - kyverno-background-controller-metrics.kyverno.svc.cluster.local:8000
          - job_name: kyverno-cleanup-controller
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - kyverno-cleanup-controller-metrics.kyverno.svc.cluster.local:8000
          - job_name: kyverno-reports-controller
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - kyverno-reports-controller-metrics.kyverno.svc.cluster.local:8000
          - job_name: kubernetes-annotated-services
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpointslice
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                action: replace
                target_label: __scheme__
                regex: (https?)
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels:
                  - __address__
                  - __meta_kubernetes_service_annotation_prometheus_io_port
                action: replace
                target_label: __address__
                regex: (.+?)(?::\d+)?;(\d+)
                replacement: $1:$2
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_service_name]
                target_label: service
              - source_labels: [__meta_kubernetes_service_name]
                target_label: job
    httpcheck/platform:
      collection_interval: 30s
      targets:
        - endpoint: http://grafana.observability.svc.cluster.local:3000/api/health
          method: GET
        - endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/health
          method: GET
        - endpoint: http://loki.observability.svc.cluster.local:3100/ready
          method: GET
        - endpoint: http://tempo.observability.svc.cluster.local:3200/ready
          method: GET
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    prometheusremotewrite:
      endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/api/v1/write
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 10m
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        queue_size: 2000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 10m
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      sending_queue:
        enabled: true
        queue_size: 2000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 10m
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  service:
    extensions:
      - health_check
    pipelines:
      metrics:
        receivers:
          - otlp
          - prometheus
          - httpcheck/platform
          - k8s_cluster
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheusremotewrite
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo
      logs:
        receivers:
          - otlp
          - k8sobjects
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/loki

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false
