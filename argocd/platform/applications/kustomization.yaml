apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Shared runtime services.
  - core/gateway.yaml
  - core/hubble.yaml
  - core/reloader.yaml

  # Identity and source control.
  - authentik/prereqs.yaml
  - authentik/postgresql.yaml
  - authentik/redis.yaml
  - authentik/app.yaml
  - forgejo/prereqs.yaml
  - forgejo/postgresql.yaml
  - forgejo/valkey.yaml
  - forgejo/app.yaml

  # Artifact storage and delivery.
  - harbor/prereqs.yaml
  - harbor/postgresql.yaml
  - harbor/valkey.yaml
  - harbor/app.yaml
  - garage/prereqs.yaml
  - garage/app.yaml
  - woodpecker/prereqs.yaml
  - woodpecker/app.yaml

  # Mail and backup.
  - stalwart/prereqs.yaml
  - stalwart/app.yaml
  - velero/prereqs.yaml
  - velero/app.yaml

  # Policy enforcement.
  - kyverno/prereqs.yaml
  - kyverno/controller.yaml
  - kyverno/policies.yaml

  # Observability stack.
  - observability/prereqs.yaml
  - observability/victoria-metrics.yaml
  - observability/loki.yaml
  - observability/tempo.yaml
  - observability/otel-collector.yaml
  - observability/grafana.yaml
