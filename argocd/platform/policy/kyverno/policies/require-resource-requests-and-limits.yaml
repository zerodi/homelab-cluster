apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-requests-and-limits
  annotations:
    policies.kyverno.io/title: Require requests and limits
    policies.kyverno.io/category: Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Требует cpu/memory requests и limits для контейнеров в прикладных workload'ах.
spec:
  evaluation:
    background:
      enabled: true
  validationActions:
    - Deny
    - Audit
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - argocd
            - cert-manager
            - external-secrets
            - gateway
            - kube-system
            - kyverno
            - openbao
            - piraeus-datastore
            - reloader
            - trust-manager
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - message: Containers must define cpu/memory requests and limits.
      expression: >-
        (!has(object.spec.containers) ||
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.requests.cpu) &&
          c.resources.requests.cpu != '' &&
          has(c.resources.requests.memory) &&
          c.resources.requests.memory != '' &&
          has(c.resources.limits) &&
          has(c.resources.limits.cpu) &&
          c.resources.limits.cpu != '' &&
          has(c.resources.limits.memory) &&
          c.resources.limits.memory != ''
        )) &&
        (!has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.requests.cpu) &&
          c.resources.requests.cpu != '' &&
          has(c.resources.requests.memory) &&
          c.resources.requests.memory != '' &&
          has(c.resources.limits) &&
          has(c.resources.limits.cpu) &&
          c.resources.limits.cpu != '' &&
          has(c.resources.limits.memory) &&
          c.resources.limits.memory != ''
        )) &&
        (!has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.requests.cpu) &&
          c.resources.requests.cpu != '' &&
          has(c.resources.requests.memory) &&
          c.resources.requests.memory != '' &&
          has(c.resources.limits) &&
          has(c.resources.limits.cpu) &&
          c.resources.limits.cpu != '' &&
          has(c.resources.limits.memory) &&
          c.resources.limits.memory != ''
        ))
