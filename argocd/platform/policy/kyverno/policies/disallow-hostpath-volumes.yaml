apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-hostpath-volumes
  annotations:
    policies.kyverno.io/title: Disallow hostPath volumes
    policies.kyverno.io/category: Baseline
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Запрещает hostPath volumes вне явно исключённых namespace'ов.
spec:
  evaluation:
    background:
      enabled: true
  validationActions:
    - Deny
    - Audit
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - argocd
            - authentik
            - cert-manager
            - external-secrets
            - forgejo
            - gateway
            - kube-system
            - kyverno
            - observability
            - openbao
            - piraeus-datastore
            - reloader
            - trust-manager
            - velero
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - message: hostPath volumes are not allowed outside excluded namespaces.
      expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath))
