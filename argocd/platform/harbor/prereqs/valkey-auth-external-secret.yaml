apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-valkey-auth
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: valkey-password
      remoteRef:
        key: platform/harbor/valkey
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: platform/harbor/valkey
        property: password
