apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql-auth
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-postgresql-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/authentik/postgresql
        property: password
