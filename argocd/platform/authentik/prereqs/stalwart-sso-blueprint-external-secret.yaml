apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-sso-blueprint
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: stalwart-sso-blueprint
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          configMap:
            name: platform-sso-blueprint-templates
            items:
              - key: stalwart.yaml
                templateAs: Values
  data:
    - secretKey: client_id
      remoteRef:
        key: platform/stalwart/oidc
        property: client_id
