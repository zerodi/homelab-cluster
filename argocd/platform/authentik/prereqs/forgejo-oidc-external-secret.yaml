apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: platform/forgejo/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: platform/forgejo/oidc
        property: client_secret
