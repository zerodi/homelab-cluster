apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-sso-blueprint-template
  namespace: authentik
data:
  forgejo-sso.yaml: |
    version: 1
    metadata:
      name: forgejo-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
        blueprints.goauthentik.io/description: "Forgejo SSO"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: "{{ .provider_name }}"
        attrs:
          name: "{{ .provider_name }}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: "{{ .client_id }}"
          client_secret: "{{ .client_secret }}"
          access_code_validity: "minutes=10"
          access_token_validity: "minutes=30"
          refresh_token_validity: "days=30"
          redirect_uris:
            - matching_mode: strict
              url: "{{ .forgejo_root_url }}/user/oauth2/authentik/callback"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: "{{ .application_slug }}"
        attrs:
          name: Forgejo
          slug: "{{ .application_slug }}"
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "{{ .provider_name }}"]]
          meta_launch_url: "{{ .forgejo_root_url }}/"
          open_in_new_tab: true
