apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-sso-blueprint
  namespace: authentik
data:
  stalwart.yaml: |
    version: 1
    metadata:
      name: stalwart-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
        blueprints.goauthentik.io/description: "Stalwart WebUI and mail OIDC provider"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: "Stalwart"
        attrs:
          name: "Stalwart"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: stalwart-webui
          grant_types:
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:device_code
          redirect_uris:
            - matching_mode: strict
              url: "https://stalwart.lab.zerodi.ru/admin/oauth/callback"
              redirect_uri_type: authorization
            - matching_mode: strict
              url: "https://stalwart.lab.zerodi.ru/account/oauth/callback"
              redirect_uri_type: authorization
          access_token_validity: "minutes=30"
          refresh_token_validity: "days=30"
          include_claims_in_id_token: true
          issuer_mode: per_provider
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: stalwart
        attrs:
          name: Stalwart
          slug: stalwart
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "Stalwart"]]
          meta_launch_url: "https://stalwart.lab.zerodi.ru/account/"
          open_in_new_tab: true
