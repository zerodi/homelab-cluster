apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-sso-blueprint
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-sso-blueprint
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          configMap:
            name: forgejo-sso-blueprint-template
            items:
              - key: forgejo-sso.yaml
                templateAs: Values
  data:
    - secretKey: client_id
      remoteRef:
        key: platform/forgejo/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: platform/forgejo/oidc
        property: client_secret
