apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Application workloads managed by ArgoCD
  sourceRepos:
    - https://git.home.arpa/platform/gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: echo
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: apps
      kind: Deployment
    - group: cert-manager.io
      kind: Certificate
    - group: ""
      kind: Service
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: networking.k8s.io
      kind: NetworkPolicy
