apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform workloads managed by ArgoCD
  sourceRepos:
    - https://git.example.invalid/replace-me/gitops.git
    - https://charts.goauthentik.io
    - code.forgejo.org/forgejo-helm
    - registry-1.docker.io/bitnamicharts
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: authentik
      server: https://kubernetes.default.svc
    - namespace: forgejo
      server: https://kubernetes.default.svc
    - namespace: gateway
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: gateway.networking.k8s.io
      kind: GatewayClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
