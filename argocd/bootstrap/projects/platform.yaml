  destinations:
    - namespace: reloader
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: "", kind: ServiceAccount}
    - {group: apps, kind: Deployment}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-delivery
  namespace: argocd
spec:
  description: Namespaced Forgejo, Harbor, and Woodpecker workloads
  sourceRepos:
    - https://git.lab.zerodi.ru/platform/gitops.git
    - code.forgejo.org/forgejo-helm
    - ghcr.io/woodpecker-ci/helm
    - registry-1.docker.io/bitnamicharts
    - https://helm.goharbor.io
  destinations:
    - {namespace: forgejo, server: "https://kubernetes.default.svc"}
    - {namespace: harbor, server: "https://kubernetes.default.svc"}
    - {namespace: woodpecker, server: "https://kubernetes.default.svc"}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "", kind: Secret}
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: batch, kind: Job}
    - {group: cert-manager.io, kind: Certificate}
    - {group: cilium.io, kind: CiliumNetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: gateway.networking.k8s.io, kind: Gateway}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
