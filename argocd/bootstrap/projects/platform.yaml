apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-orchestration
  namespace: argocd
spec:
  description: Platform Application definitions only
  sourceRepos:
    - https://git.lab.zerodi.ru/platform/gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-core-gateway
  namespace: argocd
spec:
  description: Cluster gateway bootstrap
  sourceRepos:
    - https://git.lab.zerodi.ru/platform/gitops.git
  destinations:
    - namespace: gateway
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: gateway.networking.k8s.io, kind: GatewayClass}
    - {group: cert-manager.io, kind: ClusterIssuer}
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: cert-manager.io, kind: Certificate}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: gateway.networking.k8s.io, kind: Gateway}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-core-hubble
  namespace: argocd
spec:
  description: Hubble route in kube-system
  sourceRepos:
    - https://git.lab.zerodi.ru/platform/gitops.git
  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-core-reloader
  namespace: argocd
spec:
  description: Reloader controller and its dedicated RBAC
  sourceRepos:
