apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
spec:
  description: Bootstrap metadata and root applications managed by ArgoCD
  sourceRepos:
    - https://git.lab.zerodi.ru/platform/gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: ""
      kind: Secret
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    - group: external-secrets.io
      kind: ExternalSecret
