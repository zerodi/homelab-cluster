repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: cluster-isolation
        name: task check:cluster-isolation
        entry: task check:cluster-isolation
        language: system
        pass_filenames: false
        files: ^(cluster/|.*tfvars\.example$|scripts/check-cluster-isolation\.py$|tasks/(cluster|checks|infrastructure)\.yml$|\.pre-commit-config\.yaml$)

      - id: infrastructure-isolation
        name: task check:infrastructure-isolation
        entry: task check:infrastructure-isolation
        language: system
        pass_filenames: false
        files: ^(infrastructure/|scripts/check-infrastructure-isolation\.py$|tasks/(checks|infrastructure)\.yml$|\.pre-commit-config\.yaml$)

      - id: chart-versions
        name: task check:chart-versions
        entry: task check:chart-versions
        language: system
        pass_filenames: false
        files: ^(versions\.yaml|(cluster|infrastructure|argocd)/|scripts/check-chart-versions\.py|tasks/checks\.yml|Taskfile\.yml|\.pre-commit-config\.yaml)

      - id: environment-contract
        name: task check:env-contract
        entry: task check:env-contract
        language: system
        pass_filenames: false
        files: ^(envs/|argocd/|scripts/(render-environment-contract\.sh|validate-env-contract\.py)|tasks/checks\.yml|Taskfile\.yml|\.pre-commit-config\.yaml)

      - id: runtime-secret-contract
        name: task check:runtime-secret-contract
        entry: task check:runtime-secret-contract
        language: system
        pass_filenames: false
        files: ^(argocd/platform/|scripts/.*runtime.*|tasks/(checks|ops)\.yml|Taskfile\.yml|\.pre-commit-config\.yaml)

      - id: documentation
        name: task check:documentation
        entry: task check:documentation
        language: system
        pass_filenames: false
        files: ^(README\.md|AGENTS\.md|docs/|argocd/README\.md|scripts/check-documentation\.py|tasks/checks\.yml|\.pre-commit-config\.yaml)

      - id: tofu-fmt-check
        name: task check:tofu-fmt
        entry: task check:tofu-fmt
        language: system
        pass_filenames: false

      - id: tofu-validate-cluster
        name: task check:tofu-validate-cluster
        entry: task check:tofu-validate-cluster
        language: system
        pass_filenames: false

      - id: tofu-validate-infrastructure
        name: task check:tofu-validate-infrastructure
        entry: task check:tofu-validate-infrastructure
        language: system
        pass_filenames: false

      - id: yamllint
        name: task check:yamllint
        entry: task check:yamllint
        language: system
        pass_filenames: false

      - id: shellcheck
        name: task check:shellcheck
        entry: task check:shellcheck
        language: system
        pass_filenames: false

      - id: kustomize-build-bootstrap
        name: task check:kustomize-bootstrap
        entry: task check:kustomize-bootstrap
        language: system
        pass_filenames: false

      - id: kustomize-build-platform
        name: task check:kustomize-platform
        entry: task check:kustomize-platform
        language: system
        pass_filenames: false
