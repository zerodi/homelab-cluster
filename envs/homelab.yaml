cluster:
  name: homelab-talos
  base_domain: home.arpa

gitops:
  repo_url: https://git.example.invalid/replace-me/gitops.git
  revision: main

hosts:
  argocd: argocd.home.arpa
  authentik: auth.home.arpa
  forgejo: git.home.arpa
  garage: garage.home.arpa
  harbor: harbor.home.arpa
  woodpecker: ci.home.arpa
  echo: echo.home.arpa
  grafana: grafana.home.arpa
  hubble: hubble.home.arpa

storage:
  piraeus:
    namespace: piraeus-datastore
    pool_name: pool1
    replica_count: 1
    storage_class: linstor-pool1-r1

platform:
  gateway:
    namespace: gateway
    gateway_class_name: cilium
    internal_gateway_name: internal
    external_gateway_name: external
    addresses:
      authentik: 192.168.100.241
      echo: 192.168.100.242
      grafana: 192.168.100.243
      forgejo: 192.168.100.244
      external: 192.168.100.245
      internal: 192.168.100.246
      garage: 192.168.100.247
      harbor: 192.168.100.248
      woodpecker: 192.168.100.249
  authentik:
    namespace: authentik
    runtime_secret_name: authentik-runtime
    postgresql_auth_secret_name: authentik-postgresql-auth
    redis_auth_secret_name: authentik-redis-auth
    postgresql:
      host: authentik-postgresql.authentik.svc.cluster.local
      database: authentik
      user: authentik
      chart_version: 16.7.15
    redis:
      host: authentik-redis-master.authentik.svc.cluster.local
      chart_version: 21.2.13
  forgejo:
    namespace: forgejo
    admin_secret_name: forgejo-admin-secret
    postgresql_auth_secret_name: forgejo-postgresql-auth
    valkey_auth_secret_name: forgejo-valkey-auth
    runtime_config_secret_name: forgejo-runtime-config
    oidc_secret_name: forgejo-oidc
    admin_email: forgejo@home.arpa
    root_url: https://git.home.arpa/
    postgresql:
      host: forgejo-postgresql.forgejo.svc.cluster.local:5432
      database: forgejo
      user: forgejo
      chart_version: 16.7.15
    valkey:
      host: forgejo-valkey-primary.forgejo.svc.cluster.local:6379
      chart_version: 2.4.7
    sso:
      provider_name: Authentik
      authentik_host: https://auth.home.arpa
      application_slug: forgejo
      forgejo_root_url: https://git.home.arpa
      discovery_url: https://auth.home.arpa/application/o/forgejo/.well-known/openid-configuration
  harbor:
    namespace: harbor
    runtime_secret_name: harbor-runtime
    postgresql_auth_secret_name: harbor-postgresql-auth
    valkey_auth_secret_name: harbor-valkey-auth
    host: harbor.home.arpa
    external_url: https://harbor.home.arpa
    postgresql:
      host: harbor-postgresql.harbor.svc.cluster.local
      database: registry
      user: harbor
      chart_version: 18.5.15
    valkey:
      addr: harbor-valkey-primary.harbor.svc.cluster.local:6379
      chart_version: 5.4.9
    chart_version: 1.18.0
  woodpecker:
    namespace: woodpecker
    runtime_secret_name: woodpecker-runtime
    host: ci.home.arpa
    forgejo_url: https://git.home.arpa
    chart_version: 3.5.1
    server_storage_class: linstor-pool1-r1
    server_storage_size: 10Gi
    pipeline_volume_size: 10G
  velero:
    namespace: velero
    credentials_secret_name: velero-credentials
    chart_version: 12.0.0
    bucket: homelab-velero
    prefix: clusters/homelab-talos
    region: us-east-1
    s3_url: https://minio.home.arpa
  garage:
    namespace: garage
    runtime_secret_name: garage-config
    image: dxflrs/garage
    image_tag: v2.1.0
    storage_class: linstor-pool1-r1
    size: 20Gi
    s3_service: garage-s3.garage.svc.cluster.local:3900
    admin_service: garage-admin.garage.svc.cluster.local:3903
    region: garage
  kyverno:
    namespace: kyverno
    chart_version: 3.7.1
  observability:
    namespace: observability
    grafana:
      admin_secret_name: grafana-admin-secret
      root_url: https://grafana.home.arpa/
      chart_version: 11.3.6
    victoriametrics:
      chart_version: 0.33.0
      retention: 30d
    loki:
      chart_version: 9.3.6
    tempo:
      chart_version: 2.9.0
    otel_collector:
      chart_version: 0.147.1

apps:
  echo:
    namespace: echo
    host: echo.home.arpa
