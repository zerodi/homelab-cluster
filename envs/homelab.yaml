cluster:
  name: homelab-talos
  base_domain: home.arpa
  ipv4_cidr: 192.168.100.0/24

gitops:
  repo_url: https://git.example.invalid/replace-me/gitops.git
  revision: main

identity:
  administrator:
    username: administrator
    display_name: Администратор
    email_localpart: administrator
    group: platform-admins

service_subdomains:
  argocd: argocd
  authentik: auth
  forgejo: git
  garage: garage
  harbor: harbor
  woodpecker: ci
  echo: echo
  grafana: grafana
  hubble: hubble
  stalwart: stalwart
  mail: mail
  minio: minio

storage:
  piraeus:
    namespace: piraeus-datastore
    device: /dev/sdb
    pool_name: pool1
    replica_count: 1
    storage_class: linstor-pool1-r1

platform:
  cert_manager:
    cluster_issuer_name: letsencrypt-cloudflare
    acme_server: https://acme-v02.api.letsencrypt.org/directory
    acme_email_localpart: cert-manager
    account_private_key_secret_name: letsencrypt-cloudflare-account-key
    cloudflare_api_token_secret_name: cloudflare-api-token
  gateway:
    namespace: gateway
    gateway_class_name: cilium
    internal_gateway_name: internal
    external_gateway_name: external
  authentik:
    namespace: authentik
    runtime_secret_name: authentik-runtime
    postgresql_auth_secret_name: authentik-postgresql-auth
    redis_auth_secret_name: authentik-redis-auth
    postgresql:
      host: authentik-postgresql.authentik.svc.cluster.local
      database: authentik
      user: authentik
    redis:
      host: authentik-redis-master.authentik.svc.cluster.local
  forgejo:
    namespace: forgejo
    admin_secret_name: forgejo-admin-secret
    postgresql_auth_secret_name: forgejo-postgresql-auth
    valkey_auth_secret_name: forgejo-valkey-auth
    runtime_config_secret_name: forgejo-runtime-config
    oidc_secret_name: forgejo-oidc
    postgresql:
      host: forgejo-postgresql.forgejo.svc.cluster.local:5432
      database: forgejo
      user: forgejo
    valkey:
      host: forgejo-valkey-primary.forgejo.svc.cluster.local:6379
    sso:
      provider_name: Authentik
      application_slug: forgejo
  harbor:
    namespace: harbor
    runtime_secret_name: harbor-runtime
    postgresql_auth_secret_name: harbor-postgresql-auth
    valkey_auth_secret_name: harbor-valkey-auth
    postgresql:
      host: harbor-postgresql.harbor.svc.cluster.local
      database: registry
      user: harbor
    valkey:
      addr: harbor-valkey-primary.harbor.svc.cluster.local:6379
  stalwart:
    namespace: stalwart
    runtime_secret_name: stalwart-runtime
    storage_class: linstor-pool1-r1
    storage_size: 20Gi
  woodpecker:
    namespace: woodpecker
    runtime_secret_name: woodpecker-runtime
    server_storage_class: linstor-pool1-r1
    server_storage_size: 10Gi
    pipeline_volume_size: 10G
  velero:
    namespace: velero
    credentials_secret_name: velero-credentials
    bucket: homelab-velero
    prefix: clusters/homelab-talos
    region: garage
  garage:
    namespace: garage
    runtime_secret_name: garage-config
    storage_class: linstor-pool1-r1
    size: 20Gi
    s3_service: garage-s3.garage.svc.cluster.local:3900
    admin_service: garage-admin.garage.svc.cluster.local:3903
    region: garage
  kyverno:
    namespace: kyverno
  observability:
    namespace: observability
    grafana:
      admin_secret_name: grafana-admin-secret
    victoriametrics:
      retention: 30d
    loki:
      retention: 336h
    tempo:
      retention: 168h

apps:
  echo:
    namespace: echo
