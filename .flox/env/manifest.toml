schema-version = "1.12.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
opentofu.pkg-path = "opentofu"
openbao.pkg-path = "openbao"
krew.pkg-path = "krew"
talosctl.pkg-path = "talosctl"
kustomize.pkg-path = "kustomize"
kubectl.pkg-path = "kubectl"
go-task.pkg-path = "go-task"
helm.pkg-path = "kubernetes-helm"
python.pkg-path = "python313"
uv.pkg-path = "uv"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  homelabctl_venv="$FLOX_ENV_PROJECT/homelabctl/.venv"

  if [ ! -x "$homelabctl_venv/bin/python" ]; then
    echo "Creating homelabctl virtual environment..."
    uv sync \
      --project "$FLOX_ENV_PROJECT/homelabctl" \
      --locked \
      --python python3.13 \
      --no-python-downloads
  fi
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''
